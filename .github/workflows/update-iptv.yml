name: Update IPTV M3U

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点运行（北京时间 8 点）
  workflow_dispatch:        # 允许手动触发

concurrency:
  group: update-iptv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取完整历史，便于 rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and generate M3U
        run: python fetch_m3u.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/iptv.m3u
          if git diff --staged --quiet; then
            echo "✅ 文件无变化，跳过提交"
            exit 0
          fi
          git commit -m "Auto-update IPTV M3U [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          git pull --rebase origin main
          git push
